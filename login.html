<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
</head>
<body>

<div style="
  min-height:100vh;
  background:url('img/antique-cafe-bg-01.jpg') center/cover no-repeat;
  display:flex;
  align-items:center;
  justify-content:center;
">

  <div style="
    background:rgba(0,0,0,0.75);
    padding:40px;
    width:420px;
    border-radius:12px;
    color:white;
    text-align:center;
  ">

    <h2>Login</h2>

    <input id="email" placeholder="Email" style="width:100%;padding:12px;margin:10px 0;">
    <input id="password" type="password" placeholder="Password" style="width:100%;padding:12px;margin:10px 0;">

    <button id="loginBtn" style="width:100%;padding:12px;background:#facc15;color:black;font-weight:bold;">
      Login
    </button>

    <p id="error" style="color:red;margin-top:10px;"></p>
  </div>
</div>

<script type="module">
import { auth } from "./firebase.js";
import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

document.getElementById("loginBtn").onclick = async () => {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const error = document.getElementById("error");

  error.innerText = "";

  try {
    await signInWithEmailAndPassword(auth, email, password);
    alert("✅ Login successful!");
    window.location.href = "dashboard.html";
  } catch (e) {
    error.innerText = e.message;
  }
};
</script>

</body>
</html>

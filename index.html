<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Cafeteria</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600&family=Oswald:wght@600&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/tailwind.css">
    <link rel="stylesheet" href="css/tooplate-antique-cafe.css">
</head>

<body>

<!-- ================= INTRO ================= -->
<div id="intro" class="parallax-window" data-parallax="scroll" data-image-src="img/antique-cafe-bg-01.jpg">
    <nav id="tm-nav" class="fixed w-full">
        <div class="tm-container mx-auto px-2 md:py-6 text-right">
            <button class="md:hidden py-2 px-2" id="menu-toggle">
                <i class="fas fa-2x fa-bars tm-text-gold"></i>
            </button>

            <ul class="mb-3 md:mb-0 text-2xl font-normal flex justify-end flex-col md:flex-row items-center">
                <li class="inline-block mb-4 mx-4"><a href="#intro" class="tm-text-gold">Intro</a></li>
                <li class="inline-block mb-4 mx-4"><a href="#menu" class="tm-text-gold">Menu</a></li>
                <li class="inline-block mb-4 mx-4"><a href="#about" class="tm-text-gold">About</a></li>
                <li class="inline-block mb-4 mx-4"><a href="#contact" class="tm-text-gold">Contact</a></li>

                <!-- REGISTER -->
                <li class="inline-block mb-4 mx-8">
                    <a href="register.html"
                       class="tm-text-gold border px-5 py-1 rounded hover:bg-yellow-500 hover:text-black transition">
                        Register
                    </a>
                </li>

                <!-- LOGIN -->
                <li class="inline-block mb-4 mx-8">
                    <a href="login.html"
                       class="tm-text-gold border px-5 py-1 rounded hover:bg-yellow-500 hover:text-black transition">
                        Login
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container mx-auto px-2 tm-intro-width">
        <div class="sm:pb-60 sm:pt-48 py-20">
            <div class="bg-black bg-opacity-70 p-12 mb-5 text-center">
                <h1 class="text-white text-5xl tm-logo-font mb-5">Grand Cafeteria</h1>
                <p class="tm-text-gold tm-text-2xl">Our coffee is better than your ex try once.</p>
            </div>
        </div>
    </div>
</div>

<!-- ================= MENU ================= -->
<div id="menu" class="parallax-window" data-parallax="scroll" data-image-src="img/antique-cafe-bg-02.jpg">
    <div class="container mx-auto tm-container py-24 sm:py-48">
        <div class="text-center mb-16">
            <h2 class="bg-white tm-text-brown py-6 px-12 text-4xl font-medium inline-block rounded-md">
                Our Cafe Menu
            </h2>
        </div>
    </div>
</div>

<!-- ================= ABOUT ================= -->
<div id="about" class="parallax-window" data-parallax="scroll" data-image-src="img/antique-cafe-bg-03.jpg">
    <div class="container mx-auto tm-container py-24 sm:py-48">
        <div class="bg-white bg-opacity-80 p-12 rounded-xl">
            <h2 class="tm-text-green text-4xl mb-6">About our cafe</h2>
            <p>
                We create unique experiences that change lives and bring people back.
            </p>
        </div>
    </div>
</div>

<!-- ================= CONTACT ================= -->
<div id="contact" class="parallax-window relative" data-parallax="scroll" data-image-src="img/images.jfif">
    <div class="container mx-auto tm-container pt-24 pb-48 sm:py-48">
        <div class="flex flex-col lg:flex-row justify-around items-center lg:items-stretch">

            <div class="flex-1 rounded-xl px-10 py-12 m-5 bg-white bg-opacity-80 tm-item-container">
                <h2 class="text-3xl mb-6 tm-text-green">Contact Us</h2>
                <p class="mb-6 text-lg leading-8">
                    Send us your message.
                </p>
            </div>

            <div class="flex-1 rounded-xl p-12 pb-14 m-5 bg-black bg-opacity-50 tm-item-container">
                <form id="contactForm" class="text-lg">

                    <input type="text" id="name"
                        class="input w-full bg-black border-b bg-opacity-0 text-white px-0 py-4 mb-4 tm-border-gold"
                        placeholder="Name" required />

                    <input type="email" id="email"
                        class="input w-full bg-black border-b bg-opacity-0 text-white px-0 py-4 mb-4 tm-border-gold"
                        placeholder="Email" required />

                    <textarea rows="6" id="message"
                        class="input w-full bg-black border-b bg-opacity-0 text-white px-0 py-4 mb-4 tm-border-gold"
                        placeholder="Message..." required></textarea>

                    <div class="text-right">
                        <button type="submit" class="text-white hover:text-yellow-500 transition">
                            Send it
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>

<!-- ================= JS ================= -->
<script src="js/jquery-3.6.0.min.js"></script>
<script src="js/parallax.min.js"></script>
<script src="js/jquery.singlePageNav.min.js"></script>

<!-- ================= FIREBASE CONTACT BACKEND ================= -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, addDoc, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAXDD-VqcEhh-PR83bGmW3i_7oTkJi4EJE",
    authDomain: "cafeteria-contact-app.firebaseapp.com",
    projectId: "cafeteria-contact-app",
    storageBucket: "cafeteria-contact-app.firebasestorage.app",
    messagingSenderId: "14964608074",
    appId: "1:14964608074:web:5311af5e18f5cebaec2ab3"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  document.getElementById("contactForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    try {
      await addDoc(collection(db, "contacts"), {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        message: document.getElementById("message").value,
        createdAt: serverTimestamp()
      });

      alert("✅ Message sent successfully!");
      e.target.reset();
    } catch (err) {
      alert("❌ " + err.message);
    }
  });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard - Grand Cafeteria</title>

  <link rel="stylesheet" href="css/tailwind.css">
</head>

<body style="background:#f4f4f4;">

<!-- HEADER -->
<div style="background:black;color:white;padding:20px;text-align:center;">
  <h1 style="font-size:28px;">Grand Cafeteria Dashboard</h1>
  <p id="userInfo"></p>
</div>

<!-- MAIN CONTENT -->
<div style="padding:30px;max-width:1000px;margin:auto;">

  <!-- ACTION BUTTONS -->
  <div style="margin-bottom:20px;">
    <button id="logoutBtn"
      style="padding:10px 20px;background:red;color:white;border:none;border-radius:6px;">
      Logout
    </button>
  </div>

  <!-- CONTACT MESSAGES -->
  <h2 style="font-size:22px;margin-bottom:15px;">Customer Messages</h2>

  <table border="1" width="100%" cellpadding="10" style="background:white;">
    <thead style="background:#eee;">
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Message</th>
        <th>Date</th>
      </tr>
    </thead>
    <tbody id="messagesBody">
      <!-- DATA FROM FIREBASE -->
    </tbody>
  </table>

</div>

<!-- FIREBASE -->
<script type="module">
import { auth, db } from "./firebase.js";
import { onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { collection, getDocs }
  from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* AUTH CHECK */
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "login.html";
  } else {
    document.getElementById("userInfo").innerText =
      "Welcome, " + user.email;

    loadMessages();
  }
});

/* LOAD CONTACT MESSAGES */
async function loadMessages() {
  const querySnapshot = await getDocs(collection(db, "contacts"));
  const tbody = document.getElementById("messagesBody");

  tbody.innerHTML = "";

  querySnapshot.forEach(doc => {
    const data = doc.data();
    const row = `
      <tr>
        <td>${data.name}</td>
        <td>${data.email}</td>
        <td>${data.message}</td>
        <td>${data.createdAt?.toDate().toLocaleString() || ""}</td>
      </tr>
    `;
    tbody.innerHTML += row;
  });
}

/* LOGOUT */
document.getElementById("logoutBtn").onclick = async () => {
  await signOut(auth);
  window.location.href = "login.html";
};
</script>

</body>
</html>

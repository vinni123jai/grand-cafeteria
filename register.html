<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register</title>
</head>
<body>

<div style="
  min-height:100vh;
  background:url('img/antique-cafe-bg-01.jpg') center/cover no-repeat;
  display:flex;
  align-items:center;
  justify-content:center;
">

  <div style="
    background:rgba(0,0,0,0.75);
    padding:40px;
    width:420px;
    border-radius:12px;
    color:white;
    text-align:center;
  ">

    <h2>Register</h2>

    <input id="name" placeholder="Name" style="width:100%;padding:12px;margin:10px 0;">
    <input id="email" placeholder="Email" style="width:100%;padding:12px;margin:10px 0;">
    <input id="password" type="password" placeholder="Password" style="width:100%;padding:12px;margin:10px 0;">

    <button id="registerBtn" style="width:100%;padding:12px;background:#facc15;color:black;font-weight:bold;">
      Register
    </button>

    <p id="error" style="color:red;margin-top:10px;"></p>

    <p style="margin-top:15px;">
      Already registered?
      <a href="login.html" style="color:#facc15;">Login</a>
    </p>
  </div>
</div>

<script type="module">
import { auth, db } from "./firebase.js";
import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

document.getElementById("registerBtn").onclick = async () => {
  const name = document.getElementById("name").value;
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const error = document.getElementById("error");

  error.innerText = "";

  try {
    // 🔥 CREATE USER
    const userCred = await createUserWithEmailAndPassword(auth, email, password);

    // 🔥 STORE USER DATA
    await setDoc(doc(db, "users", userCred.user.uid), {
      name,
      email,
      createdAt: new Date()
    });

    alert("✅ Registered successfully!");
    window.location.href = "login.html";

  } catch (e) {
    error.innerText = e.message;
  }
};
</script>

</body>
</html>
